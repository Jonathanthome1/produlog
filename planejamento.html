<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monte Castelo - Planejamento de Produção</title>
<style>
:root{
  --mc-azul:#1e3a8a; --mc-azul-claro:#dbeafe;
  --mc-verde:#16a34a; --mc-verde-claro:#dcfce7;
  --mc-laranja:#f59e0b; --mc-laranja-claro:#fef3c7;
  --mc-vermelho:#dc2626; --mc-vermelho-claro:#fee2e2;
  --mc-dourado:#fbbf24;
  --mc-roxo:#7c3aed;
  --bg-page:#f9fafb; --bg-card:#ffffff; --border:#e5e7eb;
  --text:#111827; --text-sec:#6b7280; --text-mut:#9ca3af;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg-page);color:var(--text);font-size:14px}
.header{background:white;border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.logo{width:36px;height:36px;background:var(--mc-azul);color:white;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700}
.brand-name{font-weight:700;font-size:15px}
.brand-sub{font-size:11px;color:var(--text-sec)}
.title-bar{padding:16px;background:white;border-bottom:1px solid var(--border)}
.page-title{font-size:20px;font-weight:700;color:var(--mc-azul)}

.tabs{display:flex;background:white;border-bottom:1px solid var(--border);padding:0 16px;gap:4px}
.tab{padding:12px 22px;border:none;background:transparent;font-size:14px;font-weight:600;cursor:pointer;color:var(--text-sec);border-bottom:3px solid transparent}
.tab.active{color:var(--mc-azul);border-bottom-color:var(--mc-azul)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 16px}
.kpi{background:white;border:1px solid var(--border);border-radius:10px;padding:12px;border-left:3px solid}
.kpi.azul{border-left-color:var(--mc-azul)}
.kpi.verde{border-left-color:var(--mc-verde)}
.kpi.laranja{border-left-color:var(--mc-laranja)}
.kpi.vermelho{border-left-color:var(--mc-vermelho)}
.kpi-label{font-size:11px;color:var(--text-sec);text-transform:uppercase;font-weight:600}
.kpi-value{font-size:22px;font-weight:700;margin-top:2px}

.controls{background:white;border:1px solid var(--border);border-radius:10px;margin:0 16px 14px;padding:12px;display:flex;gap:12px;flex-wrap:wrap}
.control-input{padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px}
.control-input.small{width:80px}
.search-box{flex:1;min-width:200px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px}
.btn{padding:7px 14px;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer}
.btn-primary{background:var(--mc-azul);color:white}
.btn-success{background:var(--mc-verde);color:white}
.btn-danger{background:var(--mc-vermelho);color:white}

.table-wrap{background:white;margin:0 16px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.table-scroll{overflow-x:auto;max-height:60vh;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead{background:var(--mc-azul);color:white;position:sticky;top:0;z-index:5}
th{padding:9px 8px;text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;white-space:nowrap}
th.num{text-align:center}
td{padding:8px;border-bottom:1px solid var(--border);white-space:nowrap}
td.num{text-align:center}
tbody tr:hover{background:#f9fafb}
.cod{color:var(--mc-azul);font-weight:600}
.badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700}
.b-verde{background:var(--mc-verde-claro);color:#065f46}
.b-laranja{background:var(--mc-laranja-claro);color:#92400e}
.b-vermelho{background:var(--mc-vermelho-claro);color:#991b1b}
.b-azul{background:var(--mc-azul-claro);color:#1e40af}
.day-input{width:54px;text-align:right;padding:4px 6px;border:1px solid var(--border);border-radius:4px;font-size:12px}
.day-input:focus{outline:none;border-color:var(--mc-azul);background:var(--mc-azul-claro)}

.prod-name{cursor:pointer;color:var(--text)}
.prod-name:hover{color:var(--mc-azul);text-decoration:underline}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100}
.modal.show{display:flex;align-items:center;justify-content:center;padding:16px}
.modal-content{background:white;border-radius:12px;max-width:700px;width:100%;max-height:90vh;overflow-y:auto}
.modal-header{padding:16px;background:var(--mc-azul);color:white;border-radius:12px 12px 0 0;display:flex;justify-content:space-between;align-items:center}
.modal-title{font-size:16px;font-weight:600}
.modal-close{background:white;color:var(--mc-azul);border:none;width:28px;height:28px;border-radius:6px;cursor:pointer;font-weight:700}
.modal-body{padding:16px}
.modal-section{margin-bottom:18px}
.modal-section h3{font-size:12px;text-transform:uppercase;color:var(--mc-azul);margin-bottom:8px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.stat-card{background:var(--bg-page);padding:10px;border-radius:8px;border-left:3px solid var(--mc-azul)}
.stat-label{font-size:10px;color:var(--text-sec);text-transform:uppercase}
.stat-value{font-size:18px;font-weight:700;margin-top:2px}
.bar-chart{margin-bottom:4px}
.bar-row{display:grid;grid-template-columns:50px 1fr 80px;gap:6px;align-items:center;margin-bottom:4px}
.bar-label{font-size:11px;font-weight:600;color:var(--text-sec)}
.bar-track{background:var(--bg-page);border-radius:4px;height:18px;overflow:hidden}
.bar-fill{background:linear-gradient(90deg,var(--mc-azul),var(--mc-azul-claro));height:100%;transition:width 0.3s}
.bar-fill.peak{background:linear-gradient(90deg,var(--mc-laranja),var(--mc-dourado))}
.bar-value{font-size:11px;font-weight:700;text-align:right}
.cliente-list{background:var(--bg-page);border-radius:8px;padding:10px}
.cliente-row{display:flex;justify-content:space-between;padding:4px 0;font-size:12px;border-bottom:1px dashed var(--border)}
.cliente-row:last-child{border-bottom:none}
textarea{width:100%;height:300px;padding:12px;border:1px solid var(--border);border-radius:8px;font-family:monospace;font-size:11px}
</style>
</head>
<body>

<div class="header">
  <div class="logo">MC</div>
  <div>
    <div class="brand-name">Monte Castelo</div>
    <div class="brand-sub">Planejamento de Produção</div>
  </div>
</div>

<div class="title-bar">
  <div class="page-title">📊 Planejamento de Produção</div>
  <div id="status" style="font-size:13px;color:var(--text-sec);margin-top:4px;">Carregando...</div>
</div>

<div class="tabs">
  <button class="tab active" data-setor="quadra" onclick="trocarTab('quadra')">🍞 Quadra <span id="badge-quadra">0</span></button>
  <button class="tab" data-setor="conf" onclick="trocarTab('conf')">🥐 Confeitaria <span id="badge-conf">0</span></button>
</div>

<div class="kpis" id="kpis"></div>

<div class="controls">
  <span style="font-size:12px;font-weight:600">Multiplicador:</span>
  <input type="number" id="mult" class="control-input small" value="2" step="0.1" min="0.5" max="5">
  <select id="order" class="control-input">
    <option value="urg">Mais urgente</option>
    <option value="vend">Mais vendido</option>
    <option value="cod">Código</option>
  </select>
  <select id="filtro" class="control-input">
    <option value="ativos">Só com venda</option>
    <option value="todos">Todos</option>
  </select>
  <input type="text" id="busca" class="search-box" placeholder="🔍 Buscar...">
  <button class="btn btn-primary" onclick="abrirModalVendas()">📥 Importar Vendas</button>
  <button class="btn btn-success" onclick="abrirModalEstoque()">📦 Importar Estoque</button>
  <button class="btn btn-primary" onclick="gerarRelatorio()" style="background:var(--mc-roxo)">📄 Gerar Plano de Produção</button>
  <button class="btn btn-success" onclick="salvarPlano()">💾 Salvar Plano</button>
  <button class="btn btn-primary" onclick="abrirHistorico()">📚 Histórico</button>
  <button class="btn btn-danger" onclick="limparTudo()">🗑️ Limpar Tudo</button>
</div>

<div class="table-wrap">
  <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th class="num">Cód</th>
          <th>Produto</th>
          <th class="num">Estoque</th>
          <th class="num">Méd/sem</th>
          <th class="num">Ideal</th>
          <th>Pico</th>
          <th class="num">Seg</th>
          <th class="num">Ter</th>
          <th class="num">Qua</th>
          <th class="num">Qui</th>
          <th class="num">Sex</th>
          <th class="num">Sáb</th>
          <th class="num">Total</th>
          <th class="num">Saldo</th>
          <th class="num">% cob</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<!-- Modais -->
<div id="modal-vendas" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title">📥 Importar Vendas</div>
    </div>
    <div class="modal-body">
      <textarea id="vendas-textarea"></textarea>
      <div style="display:flex;gap:10px;margin-top:16px;justify-content:flex-end;">
        <button class="btn" onclick="fecharModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="processarVendas()">Processar</button>
      </div>
    </div>
  </div>
</div>

<div id="modal-estoque" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title">📦 Importar Estoque</div>
    </div>
    <div class="modal-body">
      <textarea id="estoque-textarea"></textarea>
      <div style="display:flex;gap:10px;margin-top:16px;justify-content:flex-end;">
        <button class="btn" onclick="fecharModal()">Cancelar</button>
        <button class="btn btn-success" onclick="processarEstoque()">Processar</button>
      </div>
    </div>
  </div>
</div>

<div id="modal-detalhe" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title" id="modal-detalhe-title">Detalhes do Produto</div>
      <button class="modal-close" onclick="fecharModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-detalhe-body"></div>
  </div>
</div>

<div id="modal-historico" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title" id="historico-titulo">📚 Histórico de Planos</div>
      <button class="modal-close" onclick="fecharModal()">✕</button>
    </div>
    <div class="modal-body" id="historico-body" style="max-height:60vh;overflow-y:auto"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
import { getFirestore, collection, doc, setDoc, onSnapshot, getDocs, getDoc, deleteDoc } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

const app = initializeApp({
  apiKey: "AIzaSyDfFT80SMTsSMml0BpWYLDBrxrFGFG5Jk78",
  authDomain: "montecastelo-a0764.firebaseapp.com",
  projectId: "montecastelo-a0764",
  storageBucket: "montecastelo-a0764.firebasestorage.app",
  messagingSenderId: "590787056451",
  appId: "1:590787056451:web:f0a0cf2db9e5b51e2bb45f"
});

const db = getFirestore(app);
let produtos = [];
let setorAtivo = 'quadra';
const plano = {};

const DIAS = ['Seg','Ter','Qua','Qui','Sex','Sáb'];
function mult(){ return parseFloat(document.getElementById('mult').value)||2; }
function calcIdeal(p){ return Math.round((p.totalPeriodo||0)/4 * mult()); }
function calcPlanoTotal(cod){ const pl=plano[cod]||{}; return DIAS.reduce((s,d)=>s+(parseInt(pl[d])||0),0); }
function calcSaldo(p){ return Math.round(p.estoque + calcPlanoTotal(p.cod) - calcIdeal(p)); }
function calcCob(p){ const i=calcIdeal(p); return i<=0?100:Math.round((p.estoque+calcPlanoTotal(p.cod))/i*100); }
function badgeCob(pct){
  if(pct>=100) return '<span class="badge b-verde">'+pct+'%</span>';
  if(pct>=70) return '<span class="badge b-laranja">'+pct+'%</span>';
  return '<span class="badge b-vermelho">'+pct+'%</span>';
}

// Listener Firebase
onSnapshot(collection(db, 'planejProdutos'), snap => {
  produtos = snap.docs.map(d => ({id: d.id, ...d.data()}));
  console.log('📊 Produtos carregados:', produtos.length);
  render();
});

window.trocarTab = (s) => {
  setorAtivo = s;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.setor===s));
  render();
};

function render(){
  const filtro = document.getElementById('filtro')?.value || 'ativos';
  const busca = document.getElementById('busca')?.value.toLowerCase() || '';
  const ordem = document.getElementById('order')?.value || 'urg';
  
  let lista = produtos.filter(p => p.setor === setorAtivo);
  if(filtro==='ativos') lista = lista.filter(p => (p.totalPeriodo||0) > 0);
  if(busca) lista = lista.filter(p => String(p.cod).includes(busca) || (p.desc||'').toLowerCase().includes(busca));
  
  if(ordem==='urg') lista.sort((a,b) => calcCob(a) - calcCob(b));
  if(ordem==='vend') lista.sort((a,b) => (b.totalPeriodo||0) - (a.totalPeriodo||0));
  if(ordem==='cod') lista.sort((a,b) => parseInt(a.cod) - parseInt(b.cod));
  
  // Atualizar badges e status
  document.getElementById('badge-quadra').textContent = produtos.filter(p => p.setor==='quadra').length;
  document.getElementById('badge-conf').textContent = produtos.filter(p => p.setor==='conf').length;
  document.getElementById('status').textContent = produtos.length + ' produtos carregados';
  
  // Renderizar KPIs
  renderKPIs();
  
  // Tabela
  const tbody = document.getElementById('tbody');
  if(lista.length === 0){
    tbody.innerHTML = '<tr><td colspan="14" style="padding:30px;text-align:center;">Nenhum produto</td></tr>';
    return;
  }
  
  tbody.innerHTML = lista.map(p => {
    const ideal = calcIdeal(p);
    const tot = calcPlanoTotal(p.cod);
    const saldo = calcSaldo(p);
    const cob = calcCob(p);
    const pl = plano[p.cod] || {};
    const porDia = p.porDia || {};
    
    // Calcular qual dia tem maior venda
    const dias = ['Seg','Ter','Qua','Qui','Sex'];
    let maxDia = '';
    let maxQtd = 0;
    dias.forEach(d => {
      const qtd = porDia[d] || 0;
      if(qtd > maxQtd){
        maxQtd = qtd;
        maxDia = d;
      }
    });
    const picoPct = (p.totalPeriodo||0) > 0 ? Math.round((maxQtd / (p.totalPeriodo||1)) * 100) : 0;
    
    const diasInputs = DIAS.map(d => '<td class="num"><input type="number" class="day-input" data-cod="'+p.cod+'" data-dia="'+d+'" value="'+(pl[d]||'')+'" placeholder="0"></td>').join('');
    
    return '<tr>'+
      '<td class="cod">'+p.cod+'</td>'+
      '<td><span class="prod-name" onclick="abrirDetalhe(\''+p.cod+'\')">'+p.desc+'</span></td>'+
      '<td class="num">'+p.estoque+'</td>'+
      '<td class="num">'+Math.round((p.totalPeriodo||0)/4)+'</td>'+
      '<td class="num"><strong>'+ideal+'</strong></td>'+
      '<td>'+(maxDia?'<span class="badge '+(picoPct>=40?'b-laranja':'b-azul')+'">'+maxDia+' '+picoPct+'%</span>':'-')+'</td>'+
      diasInputs+
      '<td class="num" data-tot="'+p.cod+'"><strong>'+tot+'</strong></td>'+
      '<td class="num" data-saldo="'+p.cod+'"><strong style="color:'+(saldo<0?'var(--mc-vermelho)':'var(--mc-verde)')+'">'+(saldo>=0?'+':'')+saldo+'</strong></td>'+
      '<td class="num" data-cob="'+p.cod+'">'+badgeCob(cob)+'</td>'+
    '</tr>';
  }).join('');
  
  // Hooks inputs - CORRIGIDO: não re-renderizar tudo, só atualizar células
  document.querySelectorAll('.day-input').forEach(inp => {
    inp.addEventListener('input', e => {
      const cod = e.target.dataset.cod;
      const dia = e.target.dataset.dia;
      if(!plano[cod]) plano[cod] = {};
      plano[cod][dia] = parseInt(e.target.value)||0;
      
      const p = produtos.find(x => x.cod === cod);
      const tot = calcPlanoTotal(cod);
      const saldo = calcSaldo(p);
      const cob = calcCob(p);
      
      // Atualizar apenas as células de total, saldo e cobertura
      const totCell = document.querySelector('[data-tot="'+cod+'"]');
      const saldoCell = document.querySelector('[data-saldo="'+cod+'"]');
      const cobCell = document.querySelector('[data-cob="'+cod+'"]');
      
      if(totCell) totCell.innerHTML = '<strong>'+tot+'</strong>';
      if(saldoCell) saldoCell.innerHTML = '<strong style="color:'+(saldo<0?'var(--mc-vermelho)':'var(--mc-verde)')+'">'+(saldo>=0?'+':'')+saldo+'</strong>';
      if(cobCell) cobCell.innerHTML = badgeCob(cob);
      
      // Atualizar KPIs
      renderKPIs();
    });
  });
}

function renderKPIs(){
  const filtro = document.getElementById('filtro')?.value || 'ativos';
  let lista = produtos.filter(p => p.setor === setorAtivo);
  if(filtro==='ativos') lista = lista.filter(p => (p.totalPeriodo||0) > 0);
  
  const ativos = lista.filter(p => (p.totalPeriodo||0) > 0);
  const urgentes = ativos.filter(p => calcCob(p) < 70).length;
  const atencao = ativos.filter(p => { const c=calcCob(p); return c>=70 && c<100; }).length;
  const ok = ativos.filter(p => calcCob(p) >= 100).length;
  
  document.getElementById('kpis').innerHTML =
    '<div class="kpi azul"><div class="kpi-label">Produtos</div><div class="kpi-value">'+ativos.length+'</div></div>'+
    '<div class="kpi vermelho"><div class="kpi-label">🔴 Urgentes</div><div class="kpi-value">'+urgentes+'</div></div>'+
    '<div class="kpi laranja"><div class="kpi-label">🟠 Atenção</div><div class="kpi-value">'+atencao+'</div></div>'+
    '<div class="kpi verde"><div class="kpi-label">🟢 OK</div><div class="kpi-value">'+ok+'</div></div>';
}

window.abrirModalVendas = () => document.getElementById('modal-vendas').classList.add('show');
window.abrirModalEstoque = () => document.getElementById('modal-estoque').classList.add('show');
window.fecharModal = () => {
  document.getElementById('modal-vendas').classList.remove('show');
  document.getElementById('modal-estoque').classList.remove('show');
  document.getElementById('modal-detalhe').classList.remove('show');
  document.getElementById('modal-historico').classList.remove('show');
};

window.gerarRelatorio = () => {
  // Filtrar produtos com planejamento
  const produtosComPlano = produtos.filter(p => {
    const pl = plano[p.cod];
    if(!pl) return false;
    return DIAS.some(d => (pl[d] || 0) > 0);
  });
  
  if(produtosComPlano.length === 0){
    alert('Nenhum produto planejado! Preencha os dias da semana primeiro.');
    return;
  }
  
  const hoje = new Date();
  const dataStr = hoje.toLocaleDateString('pt-BR');
  
  // Separar por setor
  const quadra = produtosComPlano.filter(p => p.setor === 'quadra');
  const conf = produtosComPlano.filter(p => p.setor === 'conf');
  
  // Gerar HTML do relatório
  let html = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Plano de Produção - ${dataStr}</title>
<style>
body{font-family:Arial,sans-serif;margin:20px;font-size:12px}
h1{text-align:center;color:#1e3a8a;margin-bottom:5px}
h2{background:#1e3a8a;color:white;padding:8px;margin-top:20px;font-size:14px}
h3{background:#f59e0b;color:white;padding:6px;margin-top:15px;font-size:13px}
table{width:100%;border-collapse:collapse;margin-bottom:15px}
th{background:#e5e7eb;padding:6px;text-align:left;font-size:11px;border:1px solid #ccc}
td{padding:5px;border:1px solid #ddd;font-size:11px}
td.num{text-align:center}
.total{font-weight:700;background:#fef3c7}
@media print{
  body{margin:10px}
  h2{page-break-before:always}
  h2:first-of-type{page-break-before:avoid}
}
</style>
</head>
<body>
<h1>📊 PLANO DE PRODUÇÃO - MONTE CASTELO</h1>
<p style="text-align:center;color:#666">Gerado em: ${dataStr}</p>`;
  
  // Função para gerar tabela de um setor
  const gerarSetor = (titulo, lista) => {
    if(lista.length === 0) return '';
    
    let out = `<h2>${titulo}</h2>`;
    
    DIAS.forEach(dia => {
      const produtosDia = lista.filter(p => (plano[p.cod] || {})[dia] > 0);
      if(produtosDia.length === 0) return;
      
      out += `<h3>${dia}</h3><table><tr><th>Código</th><th>Produto</th><th class="num">Quantidade</th></tr>`;
      
      let totalDia = 0;
      produtosDia.forEach(p => {
        const qtd = plano[p.cod][dia];
        totalDia += qtd;
        out += `<tr><td>${p.cod}</td><td>${p.desc}</td><td class="num">${qtd}</td></tr>`;
      });
      
      out += `<tr class="total"><td colspan="2">TOTAL ${dia}</td><td class="num">${totalDia}</td></tr></table>`;
    });
    
    return out;
  };
  
  html += gerarSetor('🍞 QUADRA', quadra);
  html += gerarSetor('🥐 CONFEITARIA', conf);
  
  html += '</body></html>';
  
  // Abrir em nova janela
  const win = window.open('', '_blank');
  win.document.write(html);
  win.document.close();
  win.print();
};

window.carregarPlano = async (id) => {
  try {
    const docRef = doc(db, 'planosHistorico', id);
    const docSnap = await getDoc(docRef);
    
    if(!docSnap.exists()){
      alert('Plano não encontrado!');
      return;
    }
    
    const data = docSnap.data();
    console.log('📥 Carregando plano:', data.dataHora);
    console.log('Produtos salvos:', data.produtos?.length || 0);
    console.log('Planos:', Object.keys(data.planos).length);
    
    // Limpar plano atual
    Object.keys(plano).forEach(k => delete plano[k]);
    
    // Copiar planejamento
    Object.assign(plano, data.planos);
    
    // NOVO: Restaurar produtos (snapshot completo)
    if(data.produtos && data.produtos.length > 0){
      produtos = [...data.produtos];
      console.log('✅ Produtos restaurados do snapshot:', produtos.length);
    }
    
    // NOVO: Restaurar multiplicador se existir
    if(data.multiplicador){
      document.getElementById('mult').value = data.multiplicador;
    }
    
    console.log('✅ Plano carregado completamente');
    
    fecharModal();
    render();
    alert('✓ Plano carregado!\n' + data.dataHora + '\n' + Object.keys(plano).length + ' produtos planejados\n' + produtos.length + ' produtos no snapshot');
  } catch(err) {
    console.error('Erro ao carregar plano:', err);
    alert('Erro ao carregar plano: ' + err.message);
  }
};

window.abrirDetalhe = (cod) => {
  const p = produtos.find(x => x.cod === cod);
  if(!p) return;
  
  const ideal = calcIdeal(p);
  const porDia = p.porDia || {};
  const topClientes = p.topClientes || [];
  
  // Calcular número de semanas (assumir 4 por padrão)
  const numSemanas = 4;
  
  // Calcular max para os gráficos
  const dias = ['Seg','Ter','Qua','Qui','Sex'];
  const valores = dias.map(d => porDia[d] || 0);
  const maxVenda = Math.max(...valores, 1);
  
  // NOVO: Calcular médias por dia
  const medias = dias.map(d => Math.round((porDia[d] || 0) / numSemanas));
  const maxMedia = Math.max(...medias, 1);
  
  // Montar barras de TOTAL por dia
  const barsTotalDias = dias.map(d => {
    const qtd = porDia[d] || 0;
    const pct = (qtd / maxVenda) * 100;
    const pctTotal = (p.totalPeriodo||0) > 0 ? Math.round((qtd / (p.totalPeriodo||1)) * 100) : 0;
    const isPico = qtd === maxVenda && qtd > 0;
    return '<div class="bar-row">'+
      '<div class="bar-label">'+d+'</div>'+
      '<div class="bar-track"><div class="bar-fill '+(isPico?'peak':'')+'" style="width:'+pct+'%"></div></div>'+
      '<div class="bar-value">'+qtd+' <span style="color:var(--text-sec);font-size:10px">('+pctTotal+'%)</span></div>'+
    '</div>';
  }).join('');
  
  // NOVO: Montar barras de MÉDIA por dia
  const barsMediaDias = dias.map((d, idx) => {
    const media = medias[idx];
    const pct = (media / maxMedia) * 100;
    const isPico = media === maxMedia && media > 0;
    return '<div class="bar-row">'+
      '<div class="bar-label">'+d+'</div>'+
      '<div class="bar-track"><div class="bar-fill '+(isPico?'peak':'')+'" style="width:'+pct+'%"></div></div>'+
      '<div class="bar-value">'+media+'</div>'+
    '</div>';
  }).join('');
  
  // Montar lista de clientes
  const clientesHtml = topClientes.length > 0
    ? topClientes.map(c => '<div class="cliente-row"><div>'+c.nome+'</div><div style="font-weight:700;color:var(--mc-azul)">'+Math.round(c.qtd)+'</div></div>').join('')
    : '<div style="color:var(--text-sec);font-style:italic;padding:8px">Sem dados de clientes</div>';
  
  document.getElementById('modal-detalhe-title').textContent = '['+p.cod+'] '+p.desc;
  document.getElementById('modal-detalhe-body').innerHTML =
    '<div class="stat-grid">'+
      '<div class="stat-card"><div class="stat-label">Estoque atual</div><div class="stat-value">'+p.estoque+'</div></div>'+
      '<div class="stat-card"><div class="stat-label">Média semanal</div><div class="stat-value">'+Math.round((p.totalPeriodo||0)/4)+'</div></div>'+
      '<div class="stat-card"><div class="stat-label">Ideal (×'+mult()+')</div><div class="stat-value">'+ideal+'</div></div>'+
    '</div>'+
    '<div class="modal-section"><h3>📊 Total acumulado por dia da semana ('+numSemanas+' semanas)</h3>'+barsTotalDias+'</div>'+
    '<div class="modal-section"><h3>📈 Média por dia da semana</h3>'+barsMediaDias+'</div>'+
    '<div class="modal-section"><h3>👥 Top clientes do produto</h3><div class="cliente-list">'+clientesHtml+'</div></div>';
  
  document.getElementById('modal-detalhe').classList.add('show');
};

window.processarVendas = async () => {
  const texto = document.getElementById('vendas-textarea').value;
  const linhas = texto.trim().split('\n');
  const porCodigo = {};
  
  // Função para converter data em dia da semana
  function getWeekDay(dateStr) {
    const parts = dateStr.split('/');
    if(parts.length !== 3) return '';
    const day = parseInt(parts[0]);
    const month = parseInt(parts[1]) - 1;
    const year = parseInt(parts[2]);
    if(isNaN(day) || isNaN(month) || isNaN(year)) return '';
    const date = new Date(year, month, day);
    const dias = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
    return dias[date.getDay()];
  }
  
  console.log('📊 Total de linhas:', linhas.length);
  
  linhas.forEach((linha, idx) => {
    const cols = linha.split('\t');
    
    // Pular cabeçalho
    if(idx === 0 && cols[1] === 'Produto') {
      console.log('📋 Cabeçalho detectado - Total de colunas:', cols.length);
      console.log('   Coluna 26 (AA?):', cols[26]);
      return;
    }
    
    if(cols.length < 15) return;
    
    let cod = String(cols[1]).trim();
    const desc = String(cols[2]).trim();
    const qtd = parseFloat(String(cols[14]).replace(',','.')) || 0;
    const dataStr = String(cols[12]).trim(); // Ex: "20/04/2026"
    const dia = getWeekDay(dataStr); // Converte para "Seg", "Ter", etc
    const cliente = String(cols[26] || '').trim(); // NOVO: Coluna AA (índice 26)
    
    // CORRIGIDO: padronizar código (3 → 03, 12 → 12)
    if(cod && !isNaN(parseInt(cod))){
      cod = cod.padStart(2, '0');
    }
    
    // Debug das primeiras 3 linhas VÁLIDAS
    if(idx < 5 && cod && dia){
      console.log('✅ Linha', idx, '- Código:', cod, '| Cliente:', cliente || '(vazio)', '| Dia:', dia, '| Qtd:', qtd);
      console.log('   Total colunas:', cols.length, '| Col[26]:', cols[26] || '(undefined)');
    }
    
    if(!cod || isNaN(parseInt(cod)) || !dia || qtd <= 0) return;
    
    if(!porCodigo[cod]){
      porCodigo[cod] = {
        cod, desc,
        setor: parseInt(cod) < 200 ? 'quadra' : 'conf',
        totalPeriodo: 0,
        porDia: {Seg:0, Ter:0, Qua:0, Qui:0, Sex:0, Sáb:0},
        clientesMap: {} // NOVO: para agregar por cliente
      };
    }
    porCodigo[cod].totalPeriodo += qtd;
    if(porCodigo[cod].porDia[dia] !== undefined) porCodigo[cod].porDia[dia] += qtd;
    
    // NOVO: agregar por cliente
    if(cliente){
      if(!porCodigo[cod].clientesMap[cliente]) porCodigo[cod].clientesMap[cliente] = 0;
      porCodigo[cod].clientesMap[cliente] += qtd;
    }
  });
  
  // NOVO: converter clientesMap em topClientes (top 5)
  Object.values(porCodigo).forEach(p => {
    const clientesArray = Object.entries(p.clientesMap).map(([nome, qtd]) => ({nome, qtd}));
    clientesArray.sort((a, b) => b.qtd - a.qtd);
    p.topClientes = clientesArray.slice(0, 5);
    delete p.clientesMap; // remover mapa temporário
  });
  
  console.log('✅ Produtos processados:', Object.keys(porCodigo).length);
  if(Object.keys(porCodigo).length > 0){
    console.log('Exemplo produto:', Object.values(porCodigo)[0]);
  }
  
  const batch = [];
  Object.values(porCodigo).forEach(p => {
    batch.push(setDoc(doc(db, 'planejProdutos', p.cod), p, {merge: true}));
  });
  
  await Promise.all(batch);
  alert('✓ '+Object.keys(porCodigo).length+' produtos salvos!');
  fecharModal();
};

window.processarEstoque = async () => {
  const texto = document.getElementById('estoque-textarea').value;
  const linhas = texto.trim().split('\n');
  const batch = [];
  let processados = 0;
  let ignorados = 0;
  
  linhas.forEach((linha, idx) => {
    // Pular cabeçalho
    if(idx === 0 && linha.includes('Produto')) return;
    
    const partes = linha.split('\t');
    if(partes.length < 2) return;
    
    let cod = String(partes[0]).trim();
    let estoqueStr = String(partes[1]).trim();
    
    // CORRIGIDO: padronizar código com zeros (3 → 03, 7 → 07)
    if(cod && !isNaN(parseInt(cod))){
      cod = cod.padStart(2, '0');
    }
    
    // CORRIGIDO: formato brasileiro + valores inválidos
    // Só vírgula: "," → "0"
    // Começa com vírgula: ",122" → "0,122" → "0.122"
    // Termina com vírgula: "48," → "48"
    // Milhar + decimal: "1.476,47" → "1476,47" → "1476.47"
    if(estoqueStr === ',') {
      estoqueStr = '0';
    } else {
      // Se começa com vírgula, adiciona zero: ",122" → "0,122"
      if(estoqueStr.startsWith(',')) {
        estoqueStr = '0' + estoqueStr;
      }
      // Remove vírgula final: "48," → "48"
      estoqueStr = estoqueStr.replace(/,$/,'');
      // Remove pontos (milhar): "1.476,47" → "1476,47"
      estoqueStr = estoqueStr.replace(/\./g,'');
      // Troca vírgula por ponto (decimal): "1476,47" → "1476.47"
      estoqueStr = estoqueStr.replace(',','.');
    }
    const estoque = parseFloat(estoqueStr) || 0;
    
    if(!cod || isNaN(parseInt(cod))){
      ignorados++;
      return;
    }
    
    batch.push(setDoc(doc(db, 'planejProdutos', cod), {estoque}, {merge: true}));
    processados++;
  });
  
  await Promise.all(batch);
  console.log('✅ Processados:', processados, '| Ignorados:', ignorados);
  alert('✓ '+processados+' estoques atualizados!');
  fecharModal();
};
