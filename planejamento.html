<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planejamento de Produção - Monte Castelo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f3f4f6; }
.header { background: #1e3a8a; color: white; padding: 16px 24px; display: flex; align-items: center; gap: 16px; }
.logo { width: 40px; height: 40px; background: white; color: #1e3a8a; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; }
.brand-name { font-size: 20px; font-weight: 600; }
.brand-sub { font-size: 12px; opacity: 0.9; }
.container { max-width: 1400px; margin: 20px auto; padding: 0 20px; }
.card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.status-header { display: flex; justify-content: space-between; align-items: center; }
.btn { padding: 10px 18px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
.btn-primary { background: #1e3a8a; color: white; }
.btn-success { background: #16a34a; color: white; }
.btn-danger { background: #dc2626; color: white; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
thead { background: #1e3a8a; color: white; }
th, td { padding: 8px; text-align: left; }
tbody tr { border-bottom: 1px solid #e5e7eb; }
tbody tr:hover { background: #f9fafb; }
.modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; }
.modal-content { background: white; max-width: 600px; margin: 50px auto; border-radius: 12px; padding: 24px; max-height: 80vh; overflow-y: auto; }
.modal-header { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
textarea { width: 100%; height: 300px; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-family: monospace; font-size: 11px; }
.modal-actions { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">MC</div>
  <div class="brand">
    <div class="brand-name">Monte Castelo</div>
    <div class="brand-sub">Planejamento de Produção</div>
  </div>
</div>

<div id="app"></div>

<!-- Modal Importar Vendas -->
<div id="modal-vendas" class="modal">
  <div class="modal-content">
    <div class="modal-header">📥 Importar Vendas</div>
    <div style="margin-bottom:12px;font-size:12px;color:#6b7280;">Cole os dados do Excel (27 colunas)</div>
    <textarea id="vendas-textarea" placeholder="Cole aqui..."></textarea>
    <div id="vendas-preview" style="margin-top:12px;"></div>
    <div class="modal-actions">
      <button class="btn" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="processarVendas()">Processar</button>
    </div>
  </div>
</div>

<!-- Modal Importar Estoque -->
<div id="modal-estoque" class="modal">
  <div class="modal-content">
    <div class="modal-header">📦 Importar Estoque</div>
    <div style="margin-bottom:12px;font-size:12px;color:#6b7280;">Cole: Código [TAB] Quantidade</div>
    <textarea id="estoque-textarea" placeholder="119	2150\n160	208\n..."></textarea>
    <div id="estoque-preview" style="margin-top:12px;"></div>
    <div class="modal-actions">
      <button class="btn" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-success" onclick="processarEstoque()">Processar</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
import { getFirestore, collection, doc, setDoc, onSnapshot, getDocs, deleteDoc } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyDfFT80SMTsSMml0BpWYLDBrxrFGJk78",
  authDomain: "montecastelo-a0764.firebaseapp.com",
  projectId: "montecastelo-a0764",
  storageBucket: "montecastelo-a0764.firebasestorage.app",
  messagingSenderId: "590787056451",
  appId: "1:590787056451:web:f0a0cf2db9e5b51e2bb45f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let produtos = [];

console.log('✅ Firebase conectado');

// Listener
onSnapshot(collection(db, 'planejProdutos'), snap => {
  produtos = snap.docs.map(d => ({id: d.id, ...d.data()}));
  console.log('🔥 Carregados:', produtos.length, 'produtos');
  renderizar();
});

function renderizar() {
  const app = document.getElementById('app');
  
  if(produtos.length === 0) {
    app.innerHTML = `
      <div class="container">
        <div class="card" style="text-align:center;padding:60px;">
          <div style="font-size:64px;margin-bottom:20px;">📊</div>
          <h2>Nenhum dado importado</h2>
          <p style="color:#6b7280;margin:12px 0 30px;">Importe vendas e estoque para começar</p>
          <button class="btn btn-primary" onclick="abrirModalVendas()">📥 Importar Vendas</button>
          <button class="btn btn-success" onclick="abrirModalEstoque()" style="margin-left:12px;">📦 Importar Estoque</button>
        </div>
      </div>
    `;
  } else {
    const quadra = produtos.filter(p => p.setor === 'quadra');
    const conf = produtos.filter(p => p.setor === 'conf');
    
    app.innerHTML = `
      <div class="container">
        <div class="card">
          <div class="status-header">
            <div>
              <h2>📊 Dados Carregados</h2>
              <p style="color:#6b7280;font-size:14px;">${produtos.length} produtos</p>
            </div>
            <div style="display:flex;gap:10px;">
              <button class="btn btn-primary" onclick="abrirModalVendas()">📥 Reimportar</button>
              <button class="btn btn-success" onclick="abrirModalEstoque()">📦 Atualizar</button>
              <button class="btn btn-danger" onclick="limparTudo()">🗑️ Limpar</button>
            </div>
          </div>
        </div>
        
        <div class="card">
          <h3 style="margin-bottom:16px;">🍞 Quadra (${quadra.length})</h3>
          <table>
            <thead><tr><th>Código</th><th>Produto</th><th>Estoque</th><th>Total</th></tr></thead>
            <tbody>${quadra.slice(0,20).map(p => `
              <tr>
                <td style="color:#1e3a8a;font-weight:600;">${p.cod}</td>
                <td>${p.desc}</td>
                <td style="text-align:right;">${p.estoque || 0}</td>
                <td style="text-align:right;">${p.totalPeriodo || 0}</td>
              </tr>
            `).join('')}</tbody>
          </table>
        </div>
        
        <div class="card">
          <h3 style="margin-bottom:16px;">🥐 Confeitaria (${conf.length})</h3>
          <table>
            <thead><tr><th>Código</th><th>Produto</th><th>Estoque</th><th>Total</th></tr></thead>
            <tbody>${conf.slice(0,20).map(p => `
              <tr>
                <td style="color:#1e3a8a;font-weight:600;">${p.cod}</td>
                <td>${p.desc}</td>
                <td style="text-align:right;">${p.estoque || 0}</td>
                <td style="text-align:right;">${p.totalPeriodo || 0}</td>
              </tr>
            `).join('')}</tbody>
          </table>
        </div>
      </div>
    `;
  }
}

window.abrirModalVendas = () => document.getElementById('modal-vendas').style.display = 'block';
window.abrirModalEstoque = () => document.getElementById('modal-estoque').style.display = 'block';
window.fecharModal = () => {
  document.getElementById('modal-vendas').style.display = 'none';
  document.getElementById('modal-estoque').style.display = 'none';
};

window.processarVendas = async () => {
  const texto = document.getElementById('vendas-textarea').value;
  const linhas = texto.trim().split('\n').filter(l => l.trim());
  const porCodigo = {};
  
  linhas.forEach(linha => {
    const colunas = linha.split('\t');
    if(colunas.length < 27) return;
    
    const cod = String(colunas[1]).trim();
    const desc = String(colunas[2]).trim();
    const qtd = parseFloat(String(colunas[14]).replace(',', '.')) || 0;
    
    if(!cod || isNaN(parseInt(cod))) return;
    
    if(!porCodigo[cod]) {
      porCodigo[cod] = { cod, desc, totalPeriodo: 0, setor: parseInt(cod) < 200 ? 'quadra' : 'conf' };
    }
    porCodigo[cod].totalPeriodo += qtd;
  });
  
  const batch = [];
  Object.values(porCodigo).forEach(p => {
    batch.push(setDoc(doc(db, 'planejProdutos', p.cod), p, {merge: true}));
  });
  
  await Promise.all(batch);
  alert(`✓ ${Object.keys(porCodigo).length} produtos salvos!`);
  fecharModal();
};

window.processarEstoque = async () => {
  const texto = document.getElementById('estoque-textarea').value;
  const linhas = texto.trim().split('\n').filter(l => l.trim());
  const batch = [];
  
  linhas.forEach(linha => {
    const partes = linha.split('\t');
    if(partes.length < 2) return;
    
    const cod = String(partes[0]).trim();
    const estoque = parseFloat(String(partes[1]).replace(',', '.')) || 0;
    
    if(!cod || isNaN(parseInt(cod))) return;
    
    batch.push(setDoc(doc(db, 'planejProdutos', cod), {estoque}, {merge: true}));
  });
  
  await Promise.all(batch);
  alert(`✓ ${batch.length} estoques atualizados!`);
  fecharModal();
};

window.limparTudo = async () => {
  if(!confirm('Apagar TODOS os dados?')) return;
  const snapshot = await getDocs(collection(db, 'planejProdutos'));
  const batch = [];
  snapshot.docs.forEach(d => batch.push(deleteDoc(d.ref)));
  await Promise.all(batch);
  alert('✓ Dados removidos!');
};

renderizar();
</script>

</body>
</html>
